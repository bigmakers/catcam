name: CATcam
options:
  bundleIdPrefix: com.harasaki
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  CATcam:
    type: application
    platform: iOS
    sources:
      - CATcam
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "5"
        PRODUCT_BUNDLE_IDENTIFIER: com.harasaki.CATcam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Core Image の Metal カーネルをビルドするためのフラグ
        MTL_COMPILER_FLAGS: -fcikernel
        MTLLINKER_FLAGS: -cikernel
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4666YH8WY2
    # v2.0 で 100日マップ(CloudKit)を廃止したため entitlements なし
    info:
      path: CATcam/Info.plist
      properties:
        CFBundleDisplayName: CATcam
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "猫の毛並みを強調するフィルタを適用した写真を撮影し、地名・座標・地図を重ねて記録するためにカメラを使用します。例:猫にカメラを向けてシャッターを押すと、毛並みフィルタで仕上げた一枚が保存されます。"
        NSLocationWhenInUseUsageDescription: "猫を見つけた場所の地名と座標を写真や地図に記録するために位置情報を使用します。例:撮影場所が「Tokyo, Japan / 35.68°N, 139.69°E」として写真に焼き込まれます。"
        NSPhotoLibraryAddUsageDescription: "毛並みフィルタや地名・地図を焼き込んで作成した写真をフォトライブラリに保存するために使用します。例:シャッター後、加工済みの一枚がカメラロールに追加されます。"
        NSPhotoLibraryUsageDescription: "フォトライブラリの写真を取り込み、毛並みフィルタや地名・地図を焼き込んで保存するために使用します。例:過去に撮った猫の写真を選んでCATcam風に加工できます。"
